plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

apply plugin: 'com.google.protobuf'

android {
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }
    viewBinding {
        enabled = true
    }

    defaultConfig {
        applicationId "com.example.kotlin"
        minSdk 28
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "YYAPIS_API_KEY", "\"${keystoreProperties['YYAPIS_API_KEY']}\""
        buildConfigField "String", "YYAPIS_ENDPOINT", "\"${keystoreProperties['YYAPIS_ENDPOINT']}\""
        buildConfigField "Integer", "YYAPIS_PORT", "${keystoreProperties['YYAPIS_PORT']}"
        buildConfigField "Boolean", "YYAPIS_SSL", "${keystoreProperties['YYAPIS_SSL']}"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'com.example.kotlin'
}

dependencies {

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'androidx.preference:preference:1.2.1'

    implementation 'io.grpc:grpc-okhttp:1.71.0'
//    implementation 'io.grpc:grpc-protobuf:1.71.0'
    implementation 'io.grpc:grpc-protobuf-lite:1.71.0'
    implementation 'io.grpc:grpc-stub:1.71.0'
    implementation 'io.grpc:grpc-kotlin-stub:1.4.1'
    implementation "javax.annotation:javax.annotation-api:1.3.2"
    implementation 'com.beust:klaxon:5.6'
    implementation 'com.google.code.gson:gson:2.12.1'
}

protobuf {
    // https://repo1.maven.org/maven2/com/google/protobuf/protoc/
    protoc { artifact = "com.google.protobuf:protoc:${protobufVersion}" }
    plugins {
        grpc {
            // https://mvnrepository.com/artifact/io.grpc/protoc-gen-grpc-java
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcJavaVersion}"
        }
        grpckt {
            // https://mvnrepository.com/artifact/io.grpc/protoc-gen-grpc-kotlin
            artifact = "io.grpc:protoc-gen-grpc-kotlin:${grpcKotlinVersion}:jdk8@jar"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java { option 'lite' }
            }
            task.plugins {
                grpc { option 'lite' }
                grpckt {}
            }
        }
    }
}